site_name: heiplanet frontend
site_url: https://ssciwr.github.io/heiplanet-frontend/
repo_url: https://github.com/ssciwr/heiplanet-frontend
repo_name: "ssciwr/heiplanet-frontend"
copyright: Copyright &copy; 2025, Scientific Software Center, Heidelberg University.
watch: [docs, mkdocs.yml]
docs_dir: docs

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

nav:
  - Home: index.md
  - Data Flow: DataFlow.md
  - UI Components: UIComponents.md

extra_css:
  - source/stylesheets/md4py.css
  - source/stylesheets/style.css

theme:
  name: material
  #logo: path/to/file.png
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tooltips
    - navigation.footer
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    admonition:
      note: material/pencil-circle

  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to system preference

plugins:
  - search
  - include-markdown
  - glightbox
