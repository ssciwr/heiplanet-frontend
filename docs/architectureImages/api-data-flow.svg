<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1050" viewBox="0 0 1040 1050" role="img" aria-labelledby="title description">
  <title id="title">Map data flow with API calls</title>
  <desc id="description">useClimateDataLoader passes parameters to modelOutputLoader. NUTS mode requests values from GET /api/nuts_data and joins them to cached boundaries from GET /api/nuts_regions. GRID mode requests points from POST /api/cartesian and averages them into cells. Polygons or cells go to MapDisplayedDataStore and MapLayers. Min/max values go to ClimateMap state and supply both the legend and map colours.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7B80DE"/>
    </marker>
  </defs>

  <g fill="none" stroke="#7B80DE" stroke-width="2.5">
    <rect x="290" y="140" width="460" height="64" rx="12"/>
    <rect x="290" y="250" width="460" height="64" rx="12"/>
    <rect x="45" y="372" width="450" height="116" rx="12"/>
    <rect x="545" y="372" width="450" height="116" rx="12"/>
    <rect x="45" y="540" width="950" height="134" rx="12"/>
    <rect x="45" y="738" width="450" height="94" rx="12"/>
    <rect x="545" y="738" width="450" height="94" rx="12"/>
    <path d="M 520 204 V 242" marker-end="url(#arrow)"/>
    <path d="M 520 314 V 340 H 270 V 364" marker-end="url(#arrow)"/>
    <path d="M 520 340 H 770 V 364" marker-end="url(#arrow)"/>
    <path d="M 270 488 V 532" marker-end="url(#arrow)"/>
    <path d="M 770 488 V 532" marker-end="url(#arrow)"/>
    <path d="M 270 674 V 730" marker-end="url(#arrow)"/>
    <path d="M 770 674 V 730" marker-end="url(#arrow)"/>
    <path d="M 270 832 V 894" marker-end="url(#arrow)"/>
    <path d="M 770 832 V 894" marker-end="url(#arrow)"/>
  </g>

  <g fill="none" stroke="#FFC000" stroke-width="3">
    <rect x="45" y="902" width="450" height="84" rx="12"/>
    <rect x="545" y="902" width="450" height="84" rx="12"/>
  </g>

  <g fill="#7B80DE" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="520" y="44" font-size="30" font-weight="bold">Map data flow with API calls</text>
    <text x="520" y="85" font-size="21">Inputs: model selection, date and map mode</text>
    <text x="520" y="114" font-size="19">GRID also uses viewport bounds and resolution</text>

    <text x="520" y="181" font-size="27">useClimateDataLoader</text>
    <text x="592" y="232" font-size="17">parameters</text>
    <text x="520" y="291" font-size="27">modelOutputLoader</text>

    <text x="270" y="402" font-size="20" font-weight="bold">NUTS</text>
    <text x="270" y="437" font-size="26">GET /api/nuts_data</text>
    <text x="270" y="467" font-size="19">Region IDs and values</text>
    <text x="770" y="402" font-size="20" font-weight="bold">GRID</text>
    <text x="770" y="437" font-size="26">POST /api/cartesian</text>
    <text x="770" y="467" font-size="19">Latitude, longitude and values</text>

    <text x="520" y="573" font-size="24" font-weight="bold">Process API responses</text>
    <text x="285" y="608" font-size="19">NUTS: join values to polygon boundaries</text>
    <text x="285" y="643" font-size="18">GET /api/nuts_regions (cached per NUTS level)</text>
    <text x="770" y="608" font-size="19">GRID: average points into grid cells</text>
    <text x="770" y="643" font-size="19">GridProcessingStore</text>

    <text x="166" y="712" font-size="18">Polygons / cells</text>
    <text x="829" y="712" font-size="18">Min/max</text>
    <text x="270" y="778" font-size="25">MapDisplayedDataStore</text>
    <text x="270" y="809" font-size="19">Renderable polygons or cells</text>
    <text x="770" y="778" font-size="25">ClimateMap state</text>
    <text x="770" y="809" font-size="21">processedDataExtremes</text>

    <text x="270" y="938" font-size="27" font-weight="bold">MapLayers</text>
    <text x="270" y="969" font-size="19">NUTS polygons / AdaptiveGridLayer</text>
    <text x="770" y="938" font-size="27" font-weight="bold">Legend</text>
    <text x="770" y="969" font-size="19">Colour range</text>
    <text x="520" y="1025" font-size="19">The same min/max values also supply the map colours.</text>
  </g>
</svg>
